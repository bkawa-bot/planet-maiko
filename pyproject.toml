[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planet-maiko"
version = "0.1.0"
description = "Personal engineering intelligence dashboard"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "flask-sqlalchemy>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "certifi",
    "icalendar>=5.0",
    "tree-sitter>=0.22",
    "tree-sitter-java>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-flask>=1.3",
]
# Local embedding model for the rule-retrieval (RAG) layer. Pulls in
# torch (~2GB) so it's opt-in; without it RAG stays dark and the rest
# of Maiko runs fine. Install with: pip install -e ".[rag]"
rag = [
    "sentence-transformers>=2.2",
    # Temporary: huggingface_hub 1.0 dropped/renamed APIs
    # sentence-transformers still calls; pin until the stack catches up.
    "huggingface_hub<1.0",
]

[project.scripts]
maiko = "planet_maiko.cli.main:main"

# Plugins: pip packages register here to be auto-discovered on startup.
# Local plugins go in ~/.maiko/plugins/ instead.
# Example: my-plugin = "maiko_my_plugin:MyPlugin"
[project.entry-points."planet_maiko.plugins"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planet_maiko = ["static/**/*"]
