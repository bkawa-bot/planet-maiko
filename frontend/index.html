<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts: Inter for body copy, Inconsolata for label-y mono spots
         (agent names, tabs, nav pills). Inter was referenced in the
         CSS stack before but never actually loaded, so Mac rendered
         SF and Windows rendered Segoe UI — this makes both laptops
         match. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Display fonts for the greeting (and anywhere else that wants
         a cozy-weird vibe): Pixelify Sans is the default, Jersey 15 /
         Handjet / Geo are loaded alongside so swapping is a one-line
         change in index.css (--font-greeting). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inconsolata:wght@400;500;600;700&family=Bitcount+Prop+Single:wght@400;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Pixelify+Sans:wght@400;500;600;700&family=Jersey+15&family=Handjet:wght@400;500;600;700&family=Geo&family=Quicksand:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
    />

    <title>Planet Maiko</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
