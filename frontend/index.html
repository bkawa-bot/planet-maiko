<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Body: Atkinson Hyperlegible (Braille Institute, SIL OFL). Designed
         for low-vision readability, which means actual character shape
         distinctions (I, l, 1 are visibly different) — much more
         personality than Inter / DM Sans without being weird. Inter and
         DM Sans were the SaaS-default body fonts; pulling them keeps the
         rest of the app from reading as "Vercel template."
         Display: Bricolage Grotesque for the home greeting (quirky
         humanist-grotesque — loud but warm), Quicksand kept as the
         fallback, Fraunces as the warm-serif accent, Pixelify Sans for
         card-art fallbacks, Bitcount Prop Single for pixel section
         titles, Inconsolata for terminal-y labels. Darker Grotesque is
         loaded too so the greeting font can be A/B'd from --font-greeting
         without touching this link. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inconsolata:wght@400;500;600;700&family=Bitcount+Prop+Single:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Darker+Grotesque:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Pixelify+Sans:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    />

    <title>Planet Maiko</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
