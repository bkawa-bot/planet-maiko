    <!-- Experimental font pair: JetBrains Mono (body) + Bitcount Prop

         Bitcount+Single, Bitcount+Single+Ink, Bitcount+Grid+Single,
         Bitcount+Grid+Double, Bitcount+Prop+Double. To revert,
         delete these <link> tags and undo --font / --font-display
         in src/index.css. -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Bitcount+Prop+Single:wght@400;600;700&display=swap"
