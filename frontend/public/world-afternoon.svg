<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" shape-rendering="crispEdges" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="tt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0D8B8"/>
      <stop offset="25%" stop-color="#E8C8A0"/>
      <stop offset="45%" stop-color="#E0A880"/>
      <stop offset="65%" stop-color="#D08870"/>
      <stop offset="85%" stop-color="#9C5878"/>
