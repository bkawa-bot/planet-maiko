    <rect x="68" y="30" width="1" height="1" opacity="0.6"/>
    <rect x="100" y="34" width="1" height="1" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="28" width="1" height="1" opacity="0.7"/>
    <rect x="150" y="32" width="1" height="1" opacity="0.4"/>
    <rect x="25" y="42" width="1" height="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="58" y="40" width="1" height="1" opacity="0.5"/>
