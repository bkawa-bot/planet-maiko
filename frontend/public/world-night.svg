    <rect x="82" y="61" width="6" height="1" fill="#133020"/>
    <rect x="82" y="62" width="6" height="2" fill="#102818"/>
    <rect x="83" y="62" width="2" height="1" fill="#ffcc60" opacity="0.7"/>
    <rect x="86" y="62" width="1" height="1" fill="#ffcc60" opacity="0.5"/>
  </g>

  <!-- Front hill -->
  <polygon fill="#0c2418" points="0,80 10,80 10,78 22,78 22,77 35,77 35,76 50,76 50,75 68,75 68,74 85,74 85,73 105,73 105,74 120,74 120,75 133,75 133,76 143,76 143,77 150,77 150,79 160,79 160,90 0,90"/>

