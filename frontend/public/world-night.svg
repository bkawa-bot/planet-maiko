<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" shape-rendering="crispEdges" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="ns" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2529"/>
      <stop offset="40%" stop-color="#1a2540"/>
      <stop offset="65%" stop-color="#162244"/>
      <stop offset="100%" stop-color="#14203a"/>
    </linearGradient>
  </defs>

  <rect width="160" height="90" fill="url(#ns)"/>

