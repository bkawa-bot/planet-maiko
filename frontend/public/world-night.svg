    <rect x="30" y="65" width="3" height="1"/>
    <rect x="30" y="66" width="3" height="1"/>
    <rect x="31" y="67" width="1" height="1"/>
    <rect x="56" y="60" width="1" height="1"/>
    <rect x="55" y="61" width="3" height="1"/>
    <rect x="55" y="62" width="3" height="1"/>
    <rect x="56" y="63" width="1" height="1"/>
    <rect x="133" y="65" width="1" height="1"/>
    <rect x="132" y="66" width="3" height="1"/>
    <rect x="132" y="67" width="3" height="1"/>
