    <rect x="42" y="47" width="1" height="1"/>
    <rect x="41" y="48" width="3" height="1"/>
    <rect x="40" y="49" width="5" height="1"/>
    <rect x="41" y="50" width="3" height="1"/>
    <rect x="40" y="51" width="5" height="1"/>
    <rect x="42" y="52" width="1" height="2"/>
    <!-- Pine at x=65 -->
    <rect x="67" y="45" width="1" height="1"/>
    <rect x="66" y="46" width="3" height="1"/>
    <rect x="65" y="47" width="5" height="1"/>
    <rect x="66" y="48" width="3" height="1"/>
    <rect x="65" y="49" width="5" height="1"/>
    <rect x="67" y="50" width="1" height="2"/>
    <!-- Round tree at x=82 -->
    <rect x="83" y="47" width="3" height="1"/>
    <rect x="82" y="48" width="5" height="1"/>
    <rect x="82" y="49" width="5" height="1"/>
    <rect x="83" y="50" width="3" height="1"/>
    <rect x="84" y="51" width="1" height="2"/>
    <!-- Pine at x=108 -->
    <rect x="110" y="46" width="1" height="1"/>
    <rect x="109" y="47" width="3" height="1"/>
    <rect x="108" y="48" width="5" height="1"/>
    <rect x="109" y="49" width="3" height="1"/>
    <rect x="108" y="50" width="5" height="1"/>
    <rect x="110" y="51" width="1" height="2"/>
    <!-- Small pine at x=138 -->
    <rect x="139" y="55" width="1" height="1"/>
    <rect x="138" y="56" width="3" height="1"/>
    <rect x="138" y="57" width="3" height="1"/>
    <rect x="139" y="58" width="1" height="1"/>
  </g>

  <!-- Mid hill -->
  <polygon fill="#133020" points="0,74 7,74 7,72 15,72 15,70 24,70 24,68 34,68 34,66 46,66 46,64 60,64 60,63 75,63 75,62 92,62 92,63 106,63 106,65 118,65 118,67 130,67 130,69 140,69 140,71 148,71 148,73 155,73 155,75 160,75 160,90 0,90"/>

