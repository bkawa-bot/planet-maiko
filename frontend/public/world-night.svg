    <rect x="78" y="14" width="1" height="1" opacity="0.8"/>
    <rect x="95" y="8" width="1" height="1" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="110" y="20" width="1" height="1" opacity="0.7"/>
    <rect x="128" y="12" width="1" height="1" opacity="0.4">
