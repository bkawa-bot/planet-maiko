    <rect x="137" y="65" width="4" height="1" fill="#6aaa78"/>
    <rect x="136" y="66" width="6" height="1" fill="#5a8a68"/>
    <rect x="136" y="67" width="6" height="2" fill="#4a7a58"/>
    <rect x="137" y="67" width="2" height="1" fill="#f0d080" opacity="0.5"/>
    <rect x="140" y="67" width="1" height="1" fill="#f0d080" opacity="0.4"/>
  </g>

  <!-- Front hill (pixel-art stepped polygon) -->
  <polygon fill="#4a9a60" points="0,80 10,80 10,78 22,78 22,77 35,77 35,76 50,76 50,75 68,75 68,74 85,74 85,73 105,73 105,74 120,74 120,75 133,75 133,76 143,76 143,77 150,77 150,79 160,79 160,90 0,90"/>

  <!-- Flowers on front hill (pixel rect flowers) -->
  <g>
    <rect x="18" y="78" width="1" height="1" fill="#f0a0b0"/>
    <rect x="38" y="76" width="1" height="1" fill="#d0a0f0"/>
    <rect x="55" y="75" width="1" height="1" fill="#f0c080"/>
    <rect x="72" y="74" width="1" height="1" fill="#f0a0b0"/>
    <rect x="90" y="73" width="1" height="1" fill="#a0d0f0"/>
    <rect x="108" y="74" width="1" height="1" fill="#d0a0f0"/>
    <rect x="125" y="75" width="1" height="1" fill="#f0c080"/>
    <rect x="140" y="76" width="1" height="1" fill="#f0a0b0"/>
    <rect x="152" y="78" width="1" height="1" fill="#d0a0f0"/>
    <rect x="30" y="77" width="1" height="1" fill="#f0c080"/>
    <rect x="62" y="75" width="1" height="1" fill="#f0a0b0"/>
    <rect x="98" y="73" width="1" height="1" fill="#a0d0f0"/>
    <rect x="115" y="74" width="1" height="1" fill="#d0a0f0"/>
    <rect x="148" y="77" width="1" height="1" fill="#f0c080"/>
  </g>

  <!-- Dew sparkles (pixel rects) -->
  <g fill="#fff">
    <rect x="45" y="74" width="1" height="1" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="71" width="1" height="1" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="95" y="73" width="1" height="1" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.25;0.6" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="55" y="76" width="1" height="1" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="72" width="1" height="1" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Path on front hill -->
  <g fill="#d8c8a0" opacity="0.3">
    <rect x="88" y="90" width="2" height="1"/>
    <rect x="87" y="88" width="2" height="2"/>
    <rect x="86" y="86" width="2" height="2"/>
    <rect x="85" y="84" width="2" height="2"/>
    <rect x="86" y="82" width="2" height="2"/>
    <rect x="87" y="80" width="2" height="2"/>
    <rect x="89" y="78" width="2" height="2"/>
    <rect x="91" y="76" width="2" height="2"/>
    <rect x="93" y="75" width="2" height="1"/>
  </g>
</svg>
