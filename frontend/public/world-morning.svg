    <rect x="63" y="32" width="8" height="1"/>
    <rect x="64" y="33" width="6" height="1"/>
  </g>

  <!-- Back hill (pixel-art stepped polygon, dewy green) -->
  <polygon fill="#8ab890" points="0,64 5,64 5,62 11,62 11,60 18,60 18,58 26,58 26,56 36,56 36,54 48,54 48,53 60,53 60,52 75,52 75,53 85,53 85,55 93,55 93,54 103,54 103,53 118,53 118,55 126,55 126,57 134,57 134,59 141,59 141,61 148,61 148,63 155,63 155,65 160,65 160,90 0,90"/>

  <!-- Trees on back hill (pixel art) -->
  <g>
    <!-- Pine at x=40 -->
    <rect x="42" y="47" width="1" height="1" fill="#2d6838"/>
    <rect x="41" y="48" width="3" height="1" fill="#2d6838"/>
    <rect x="40" y="49" width="5" height="1" fill="#2d6838"/>
    <rect x="41" y="50" width="3" height="1" fill="#3a8a4a"/>
    <rect x="40" y="51" width="5" height="1" fill="#3a8a4a"/>
    <rect x="42" y="52" width="1" height="2" fill="#8a6420"/>
    <!-- Pine at x=65 -->
    <rect x="67" y="45" width="1" height="1" fill="#2d6838"/>
    <rect x="66" y="46" width="3" height="1" fill="#2d6838"/>
    <rect x="65" y="47" width="5" height="1" fill="#2d6838"/>
    <rect x="66" y="48" width="3" height="1" fill="#3a8a4a"/>
    <rect x="65" y="49" width="5" height="1" fill="#3a8a4a"/>
    <rect x="67" y="50" width="1" height="2" fill="#8a6420"/>
    <!-- Round tree at x=82 -->
    <rect x="83" y="47" width="3" height="1" fill="#3a8a4a"/>
    <rect x="82" y="48" width="5" height="1" fill="#2d6838"/>
    <rect x="82" y="49" width="5" height="1" fill="#3a8a4a"/>
    <rect x="83" y="50" width="3" height="1" fill="#2d6838"/>
    <rect x="84" y="51" width="1" height="2" fill="#8a6420"/>
    <!-- Pine at x=108 -->
    <rect x="110" y="46" width="1" height="1" fill="#2d6838"/>
    <rect x="109" y="47" width="3" height="1" fill="#2d6838"/>
    <rect x="108" y="48" width="5" height="1" fill="#3a8a4a"/>
    <rect x="109" y="49" width="3" height="1" fill="#3a8a4a"/>
    <rect x="108" y="50" width="5" height="1" fill="#2d6838"/>
    <rect x="110" y="51" width="1" height="2" fill="#8a6420"/>
    <!-- Small pine at x=138 -->
    <rect x="139" y="55" width="1" height="1" fill="#2d6838"/>
    <rect x="138" y="56" width="3" height="1" fill="#3a8a4a"/>
    <rect x="138" y="57" width="3" height="1" fill="#2d6838"/>
    <rect x="139" y="58" width="1" height="1" fill="#8a6420"/>
  </g>

  <!-- Mid hill (pixel-art stepped polygon) -->
  <polygon fill="#6aaa78" points="0,74 7,74 7,72 15,72 15,70 24,70 24,68 34,68 34,66 46,66 46,64 60,64 60,63 75,63 75,62 92,62 92,63 106,63 106,65 118,65 118,67 130,67 130,69 140,69 140,71 148,71 148,73 155,73 155,75 160,75 160,90 0,90"/>

