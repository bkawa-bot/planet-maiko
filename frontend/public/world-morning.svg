<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" shape-rendering="crispEdges" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="ms" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d8f0"/>
      <stop offset="25%" stop-color="#f0c8d8"/>
      <stop offset="50%" stop-color="#f8d8b0"/>
      <stop offset="75%" stop-color="#f0e0a0"/>
      <stop offset="100%" stop-color="#e8d090"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="160" height="90" fill="url(#ms)"/>

  <!-- Sunrise glow (pixel rect) -->
  <g fill="#ffd080" opacity="0.15">
    <rect x="50" y="58" width="60" height="1"/>
    <rect x="40" y="59" width="80" height="1"/>
    <rect x="30" y="60" width="100" height="1"/>
    <rect x="20" y="61" width="120" height="2"/>
    <rect x="10" y="63" width="140" height="2"/>
    <rect x="0" y="65" width="160" height="3"/>
  </g>

  <!-- Horizon glow lines -->
  <rect x="0" y="62" width="160" height="1" fill="#f0c880" opacity="0.4"/>
  <rect x="0" y="64" width="160" height="1" fill="#e8b870" opacity="0.3"/>

  <!-- Sun (half rising, pixel art) -->
  <g fill="#ffd060" opacity="0.3">
    <rect x="74" y="60" width="12" height="1"/>
    <rect x="72" y="61" width="16" height="1"/>
    <rect x="71" y="62" width="18" height="1"/>
    <rect x="70" y="63" width="20" height="1"/>
    <rect x="70" y="64" width="20" height="1"/>
    <rect x="70" y="65" width="20" height="2"/>
  </g>
  <g fill="#ffe080" opacity="0.5">
    <rect x="76" y="62" width="8" height="1"/>
    <rect x="75" y="63" width="10" height="1"/>
    <rect x="74" y="64" width="12" height="1"/>
    <rect x="74" y="65" width="12" height="2"/>
  </g>

  <!-- Clouds (pixel art) -->
  <g fill="#f0e0f0" opacity="0.5">
    <rect x="22" y="24" width="6" height="1"/>
    <rect x="20" y="25" width="10" height="1"/>
    <rect x="21" y="26" width="8" height="1"/>
    <rect x="22" y="27" width="5" height="1"/>
  </g>
  <g fill="#f8e0e0" opacity="0.4">
    <rect x="115" y="17" width="5" height="1"/>
    <rect x="113" y="18" width="9" height="1"/>
    <rect x="114" y="19" width="7" height="1"/>
  </g>
  <g fill="#f0e8f0" opacity="0.35">
